name: Release

on:
  workflow_dispatch:

jobs:
  build-pack-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VELOPACK_GITHUB_TOKEN: ${{ secrets.VELOPACK_GITHUB_TOKEN }}
      VPK_TOKEN: ${{ secrets.VELOPACK_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\UltScan\UltScan.csproj

      - name: Publish
        run: dotnet publish .\UltScan\UltScan.csproj -c Release -r win-x64 -o .\artifacts\publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Verify GitHub token
        shell: pwsh
        run: |
          if (-not $env:VELOPACK_GITHUB_TOKEN) { throw "VELOPACK_GITHUB_TOKEN is missing." }
          Write-Host "VELOPACK_GITHUB_TOKEN present"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content .\UltScan\UltScan.csproj
          $version = $csproj.Project.PropertyGroup.Version
          if (-not $version) { throw 'Version not found in UltScan.csproj' }
          $parts = $version.Split('.')
          if ($parts.Length -lt 3) { throw "Version must have at least 3 parts, got: $version" }
          $packVersion = if ($parts.Length -ge 4) { "$($parts[0]).$($parts[1]).$($parts[2])+$($parts[3])" } else { "$($parts[0]).$($parts[1]).$($parts[2])" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "pack_version=$packVersion" >> $env:GITHUB_OUTPUT

      - name: Download previous releases (for delta packages)
        run: vpk download github --repoUrl https://github.com/AlexChuzha/UltScan --token $env:VELOPACK_GITHUB_TOKEN

      - name: Pack
        run: vpk pack --packId AlexChuzha.UltScan --packVersion ${{ steps.version.outputs.pack_version }} --packDir .\artifacts\publish --mainExe UltScan.exe

      - name: Upload to GitHub Release
        run: vpk upload github --repoUrl https://github.com/AlexChuzha/UltScan --token $env:VELOPACK_GITHUB_TOKEN --publish --releaseName "UltScan ${{ steps.version.outputs.version }}" --tag ${{ github.event.release.tag_name || format('v{0}', steps.version.outputs.version) }}
